# ShipSafe rules check: copy to .github/workflows/rules-check.yml
name: rules-check
on: [pull_request, push]
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AGENTS.md exists
        run: test -f AGENTS.md
      - name: CLAUDE.md and GEMINI.md import AGENTS.md
        run: |
          for f in CLAUDE.md GEMINI.md; do
            if [ -f "$f" ] && ! grep -q '@./AGENTS.md' "$f"; then
              echo "::error file=$f::$f should import @./AGENTS.md so every agent reads the same rules"; exit 1
            fi
          done
      - name: No secrets in rules files
        run: |
          files=$(ls AGENTS.md CLAUDE.md GEMINI.md .cursor/rules/* .github/copilot-instructions.md 2>/dev/null || true)
          [ -z "$files" ] && exit 0
          if grep -nE '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' $files; then
            echo "::error::Possible secret in a rules file. Move it to an env var."; exit 1
          fi
      - name: Rules files don't point at deleted paths
        run: |
          # Flags `backticked/paths` in rules files that no longer exist, so agents don't follow stale instructions.
          files=$(ls AGENTS.md CLAUDE.md GEMINI.md .cursor/rules/* .github/copilot-instructions.md 2>/dev/null || true)
          [ -z "$files" ] && exit 0
          bad=0
          for f in $files; do
            for p in $(grep -oE '`\.?/?[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+/?`' "$f" | tr -d '`' | sort -u); do
              case "$p" in *://*|*'*'*|*'<'*) continue;; esac
              if [ ! -e "${p#./}" ]; then
                echo "::error file=$f::$f mentions \`$p\` but that path doesn't exist. Update or remove the rule."; bad=1
              fi
            done
          done
          exit $bad
      - name: Root rules files stay short
        run: |
          # Long root rules files get skimmed and ignored. Warn past 150 lines, fail past 300 (tune to taste).
          bad=0
          for f in AGENTS.md CLAUDE.md GEMINI.md; do
            [ -f "$f" ] || continue
            n=$(wc -l < "$f")
            if [ "$n" -gt 300 ]; then
              echo "::error file=$f::$f is $n lines. Move detail into linked docs or skills and keep the root file under 150."; bad=1
            elif [ "$n" -gt 150 ]; then
              echo "::warning file=$f::$f is $n lines. Agents follow short root files more reliably; aim for under 150."
            fi
          done
          exit $bad
